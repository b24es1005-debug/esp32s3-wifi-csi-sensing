name: Python CI

on:
  push:
    branches: [ main, firmware, ml, python, data, docs ]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python/requirements.txt
          pip install black flake8 mypy

      - name: Black check
        run: black --check python

      - name: Flake8
        run: flake8 python

      - name: Mypy
        run: mypy python
